[package]
name = "toroidal-store"
version = "0.1.0"
edition = "2021"
description = "ToroidalStore Correctness Core — WAL + MemTable + Recovery + Segment + Compaction"

[lib]
name = "toroidal_store"
path = "lib.rs"

[[bench]]
name = "store_bench"
harness = false

[[bench]]
name = "gate"
harness = false

[[bench]]
name = "group_commit_prod"
harness = false

[[bin]]
name = "compare"
path = "benchmarks/compare/compare.rs"

[[bin]]
name = "durability"
path = "benches/durability.rs"

[dependencies]
parking_lot = "0.12"
dashmap = "5.5"
crc32fast = "1.3"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"
