[package]
name = "toroidal-db"
version = "3.1.0"
edition = "2021"
description = "Hybrid vector-graph database with toroidal topology"
license = "MIT"
repository = "https://github.com/nanocubit/toroidal-db"
keywords = ["database", "vector", "graph", "topology", "search"]
categories = ["database", "data-structures"]

[dependencies]
# Web framework
axum = { version = "0.7.9", features = ["macros", "multipart"] }
axum-server = { version = "0.7.1", features = ["tls-rustls"] }

# Async runtime
tokio = { version = "1.42", features = ["full", "rt-multi-thread"] }

# Serialization
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.135", features = ["preserve_order"] }
bincode = "1.3.3"

# Storage
sled = "0.34.7"
toroidal-store = { path = "crates/toroidal-store" }
rocksdb = { version = "0.22", optional = true }

# Concurrency & parallelism
dashmap = "6.1"
rayon = "1.10"

# HTTP client
reqwest = { version = "0.12.12", features = ["json", "rustls-tls"], default-features = false }

# CLI
clap = { version = "4.5.27", features = ["derive"] }

# Cryptography & auth
bcrypt = "0.16"
jsonwebtoken = "9.3"
uuid = { version = "1.12", features = ["v4"] }

# Math & data processing
ndarray = "0.16"
csv = "1.3"
pdf-extract = "0.7"
regex = "1.11"
wide = { version = "0.7", optional = true }

# ML & Embeddings (optional features for multilingual-e5-small support)
ort = { version = "2.0.0-rc.11", optional = true }  # ONNX Runtime
tokenizers = { version = "0.20", optional = true }  # HuggingFace tokenizers
candle-core = { version = "0.8", optional = true }  # HuggingFace Candle (ML framework)
candle-transformers = { version = "0.8", optional = true }
num_cpus = { version = "1.16", optional = true }  # CPU detection for ONNX threads

# Parsing
nom = "7.1"
bytes = "1.9"

# GraphQL
async-graphql = "7.0.13"
async-graphql-axum = "7.0.13"

# Utilities
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
anyhow = "1.0.95"
lazy_static = "1.5"
chrono = { version = "0.4.39", features = ["serde"] }
rand = "0.8.5"
async-trait = "0.1.85"
futures-util = "0.3"
tokio-tungstenite = "0.21"

# Monitoring
prometheus = "0.13"

# PGWire protocol (optional feature for PostgreSQL compatibility)
pgwire = { version = "0.28", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.15"

[lib]
name = "toroidal_db"
path = "src/lib.rs"

[[bin]]
name = "toroidal-db"
path = "src/main.rs"

[[bin]]
name = "toroidal-cli"
path = "src/cli.rs"

[[bin]]
name = "verify-toroidal"
path = "src/bin/verify_toroidal.rs"

[[bench]]
name = "e8_bench"
harness = false

[[bench]]
name = "vector_search_bench"
harness = false

[[bench]]
name = "feature_bench"
harness = false

[features]
default = ["pgwire"]
cuda = ["ort/cuda"]
pgwire = ["dep:pgwire"]
avx2 = ["wide"]
avx512 = ["wide"]
rocksdb-storage = ["dep:rocksdb"]

# Embedding models support
embeddings = ["ort", "tokenizers", "num_cpus"]  # ONNX Runtime + HuggingFace tokenizers
candle = ["candle-core", "candle-transformers"]  # Pure Rust ML with Candle
multilingual-e5 = ["embeddings"]  # Full multilingual E5 support with ONNX

[package.metadata.docs.rs]
features = ["pgwire"]  # Build docs with minimal features

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[lints.rust]
unsafe_code = "warn"

# Lint-группы, ранее ошибочно указанные в clippy.toml (там допустимы только
# machine-applicable ключи вроде disallowed-methods)
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
doc_markdown = "warn"
empty_line_after_doc_comments = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
if_not_else = "warn"
implicit_hasher = "warn"
inconsistent_struct_constructor = "warn"
large_stack_arrays = "warn"
macro_use_imports = "warn"
manual_filter_map = "warn"
manual_find_map = "warn"
map_flatten = "warn"
match_same_arms = "warn"
needless_borrow = "warn"
needless_continue = "warn"
range_plus_one = "warn"
single_match_else = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_enum_variant = "warn"
used_underscore_binding = "warn"
wildcard_dependencies = "warn"
