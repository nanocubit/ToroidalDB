[package]
name = "guitor"
version = "0.1.0"
description = "GuiTor - DataGrip 2.0 на Rust/Tauri"
authors = ["Vladimir"]
edition = "2021"
rust-version = "1.70"

[dependencies]
# Tauri v2
tauri = { version = "2.0", features = ["tray-icon", "updater", "system-tray"] }
tauri-plugin-shell = "2.0"
tauri-plugin-prevent-default = "0.1"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-http = "2.0"
tokio = { version = "1.0", features = ["full"] }

# Multi-DB support via sqlx
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "postgres",
  "mysql",
  "sqlite",
  "any",
  "chrono",
  "uuid",
  "json"
] }

# ToroidalDB integration
toroidal-db = { path = "../../../" }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Web browser
webbrowser = "0.8"

# Storage
sled = "0.34"
rocksdb = "0.21"
bincode = "1.3"
dashmap = "5.5"

# Utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = "1.10"

# Graph
petgraph = { version = "0.6", features = ["serde-1"] }

# Search
tantivy = { version = "0.22", features = ["mmap", "zstd"] }

# File processing
pdf-extract = "0.7"

# SQL Parser for autocomplete
sqlparser = { version = "0.45", features = ["std"] }

# SQL Formatter
sqlformat = "0.2"

# Git Integration (Phase 3)
git2 = { version = "0.18", features = ["vendored-openssl"] }

# SSH Tunnels (Phase 3)
ssh2 = "0.9"

# HTTP Client for AI
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Data processing
polars = { version = "0.43", features = ["lazy", "serde"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = ["custom-protocol"]
production = ["tauri/custom-protocol"]
dev = ["tauri/dev"]
custom-protocol = ["tauri/custom-protocol"]
